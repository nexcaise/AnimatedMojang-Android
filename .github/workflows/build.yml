name: Build

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "LICENSE", "COPYING*"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_API: 28

jobs:
  host-tests:
    name: Host renderer tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Mesa test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libegl1 libgles2 libegl-mesa0 libgl1-mesa-dri
      - name: Validate baked title atlas
        run: |
          python3 - <<'PY'
          import json, os
          root = "resources/textures/animated_mojang/title/baked"
          data = json.load(open(f"{root}/title_atlas.json"))
          assert data["version"] == 1 and len(data["frames"]) == 69
          for page in data["pages"]:
              assert os.path.getsize(f"{root}/{page['file']}") > 0
          print("Title atlas OK:", len(data["frames"]), "frames")
          PY
      - name: Run renderer tests
        run: chmod +x tests/host/run.sh && tests/host/run.sh

  android:
    name: Android arm64-v8a (signature-resolved Minecraft builds)
    runs-on: ubuntu-24.04
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
      - name: Configure with Android NDK
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${ANDROID_API} \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Verify binary and dependencies
        run: |
          READELF="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          NM="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$READELF" -h build/libAnimatedMojang.so | grep -E "Class|Machine"
          "$READELF" -d build/libAnimatedMojang.so | grep -E "libnmdk.so|RUNPATH|RPATH"
          "$NM" -D --defined-only build/libAnimatedMojang.so | grep -q ' PLGetModRegistration$'
          test -s vendor/nmdk/libs/arm64-v8a/libnmdk.so  # link-time only; NOT packaged
      - name: Package LeviPack
        run: tools/make_levipack.sh build/libAnimatedMojang.so dist/animated_mojang.levipack
      - uses: actions/upload-artifact@v4
        with:
          name: animated-mojang-levipack
          path: dist/animated_mojang.levipack
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: animated-mojang-arm64-v8a
          path: build/libAnimatedMojang.so
          if-no-files-found: error

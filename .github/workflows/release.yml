name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v2.1.0"
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          python3 - "$VERSION" <<'PY'
          import json, sys
          expected = sys.argv[1]
          for path in ("manifest.json", "tooth.json"):
              actual = json.load(open(path))["version"]
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected}, got {actual}")
          PY
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    uses: ./.github/workflows/build.yml
  publish:
    runs-on: ubuntu-24.04
    needs: [version, build]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: animated-mojang-levipack
          path: dist
      - name: Prepare release notes
        run: |
          VERSION="${{ needs.version.outputs.tag }}"
          VERSION="${VERSION#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {show=1; next} /^## \[/ {show=0} show' CHANGELOG.md > notes.md
          test -s notes.md || echo "Animated Mojang $VERSION" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Animated Mojang ${{ needs.version.outputs.tag }}
          body_path: notes.md
          files: dist/animated_mojang.levipack
          fail_on_unmatched_files: true
